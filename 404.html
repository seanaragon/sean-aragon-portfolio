<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Page not found — Sean Aragon</title>
<meta name="theme-color" content="#eee9df">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23F42902%27/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=Instrument+Serif:ital@1&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#eee9df;--ink:#161514;--ink-2:#4a4743;--red:#F42902}
  @media (prefers-color-scheme:dark){ :root{--paper:#1c1b19;--ink:#ece6da;--ink-2:#bdb6aa;--red:#ff3a12} }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:640px;width:100%}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
  h1{font-size:clamp(84px,22vw,190px);line-height:.85;letter-spacing:-.06em;font-weight:800;margin:14px 0 22px}
  h1 span{color:var(--red);font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.03em}
  p{font-size:18px;line-height:1.5;color:var(--ink-2);max-width:40ch;margin-bottom:30px}
  .btn{display:inline-block;padding:13px 22px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;font-size:15px;text-decoration:none;transition:background .2s}
  .btn:hover,.btn:focus-visible{background:var(--red);outline:none}
  @media (prefers-reduced-motion:no-preference){ .btn{transition:background .2s} }
</style>
</head>
<body>
<main>
  <p class="mono">Error 404</p>
  <h1>Off the <span>timeline.</span></h1>
  <p>This page doesn’t exist or has moved. Everything is on one page now.</p>
  <a class="btn" href="/sean-aragon-portfolio/">Back to the portfolio →</a>
</main>
</body>
</html>
